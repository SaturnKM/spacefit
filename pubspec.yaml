name: spacefit
description: Spacefit shop UI
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#1C1612"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1C1612"
  image: assets/splash.png
  android_12:
    color: "#1C1612"
    image: assets/splash_android12.png
